<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background:#020617; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Gradients -->
    <linearGradient id="clientGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="plumbGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d9488" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="objectGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="refGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#be123c" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="diskGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#020617"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Diagram Title -->
  <g transform="translate(40, 45)">
    <circle cx="8" cy="8" r="6" fill="#38bdf8" />
    <circle cx="8" cy="8" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5"/>
    <text x="28" y="14" fill="#f8fafc" font-size="18" font-weight="700" letter-spacing="0.5">GIT ENGINE ARCHITECTURE &amp; DATA FLOW</text>
    <text x="28" y="32" fill="#94a3b8" font-size="12">End-to-end system topology: Working tree, plumbing pipeline, content-addressable object store, and ref pointers</text>
  </g>

  <!-- Flow Lines / Connections -->
  <!-- User/CLI to Staging -->
  <path d="M 160 210 L 250 210" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="200" fill="#38bdf8" font-size="10" font-weight="600">git add</text>

  <!-- Staging to Object Engine -->
  <path d="M 390 210 L 480 210" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="405" y="200" fill="#34d399" font-size="10" font-weight="600">write-tree</text>

  <!-- Staging to Commit Engine -->
  <path d="M 390 240 L 440 240 L 440 370 L 480 370" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="400" y="300" fill="#34d399" font-size="10" font-weight="600">git commit</text>

  <!-- Commit Engine to Object Graph -->
  <path d="M 640 370 L 720 370" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="655" y="360" fill="#a78bfa" font-size="10" font-weight="600">points to</text>

  <!-- Commit Engine to Ref Subsystem -->
  <path d="M 640 400 L 680 400 L 680 540 L 720 540" fill="none" stroke="#e11d48" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="650" y="470" fill="#f43f5e" font-size="10" font-weight="600">update-ref</text>

  <!-- Object Store to Disk Subsystem -->
  <path d="M 870 270 L 920 270 L 920 370" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="880" y="315" fill="#fbbf24" font-size="10" font-weight="600">zlib / gc</text>

  <!-- Tier 1: Client & Working Tree -->
  <g transform="translate(40, 120)">
    <rect width="120" height="480" rx="10" fill="url(#clientGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <text x="60" y="30" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">CLIENT TIER</text>
    
    <!-- User / CLI -->
    <g transform="translate(15, 60)">
      <rect width="90" height="80" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="45" y="32" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Working</text>
      <text x="45" y="48" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Tree</text>
      <text x="45" y="66" fill="#94a3b8" font-size="9" text-anchor="middle">(Disk Files)</text>
    </g>

    <!-- Developer Shell -->
    <g transform="translate(15, 170)">
      <rect width="90" height="70" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="45" y="30" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Porcelain</text>
      <text x="45" y="46" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">CLI</text>
      <text x="45" y="60" fill="#94a3b8" font-size="8" text-anchor="middle">(add, commit)</text>
    </g>

    <!-- Config / Hooks -->
    <g transform="translate(15, 270)">
      <rect width="90" height="70" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2"/>
      <text x="45" y="32" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Git Hooks</text>
      <text x="45" y="50" fill="#94a3b8" font-size="9" text-anchor="middle">&amp; Config</text>
    </g>
  </g>

  <!-- Tier 2: Staging / Plumbing Area -->
  <g transform="translate(250, 120)">
    <rect width="140" height="480" rx="10" fill="url(#plumbGrad)" stroke="#0d9488" stroke-width="1.5"/>
    <text x="70" y="30" fill="#2dd4bf" font-size="12" font-weight="700" text-anchor="middle">STAGING &amp; PIPELINE</text>

    <!-- Staging Index -->
    <g transform="translate(15, 60)">
      <rect width="110" height="90" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2"/>
      <text x="55" y="30" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">.git/index</text>
      <text x="55" y="48" fill="#5eead4" font-size="10" text-anchor="middle">(Binary Cache)</text>
      <text x="55" y="66" fill="#94a3b8" font-size="8" text-anchor="middle">Paths, Modes, SHAs</text>
      <text x="55" y="78" fill="#94a3b8" font-size="8" text-anchor="middle">Stat Cache / mtime</text>
    </g>

    <!-- Plumbing Hash Processor -->
    <g transform="translate(15, 180)">
      <rect width="110" height="80" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2"/>
      <text x="55" y="30" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">hash-object</text>
      <text x="55" y="48" fill="#94a3b8" font-size="9" text-anchor="middle">SHA Calculation</text>
      <text x="55" y="64" fill="#94a3b8" font-size="8" text-anchor="middle">Header Injection</text>
    </g>

    <!-- Diff Engine -->
    <g transform="translate(15, 290)">
      <rect width="110" height="70" rx="6" fill="#0f172a" stroke="#14b8a6" stroke-width="1.2"/>
      <text x="55" y="30" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Diff Engine</text>
      <text x="55" y="48" fill="#94a3b8" font-size="9" text-anchor="middle">Three-Way Merge</text>
    </g>
  </g>

  <!-- Tier 3: Core Object Generation Engines -->
  <g transform="translate(480, 120)">
    <rect width="160" height="480" rx="10" fill="url(#objectGrad)" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="80" y="30" fill="#c084fc" font-size="12" font-weight="700" text-anchor="middle">OBJECT SYNTHESIS</text>

    <!-- Blob Generator -->
    <g transform="translate(15, 60)">
      <rect width="130" height="65" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="65" y="28" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Blob Builder</text>
      <text x="65" y="46" fill="#c084fc" font-size="9" text-anchor="middle">Pure Byte Stream</text>
    </g>

    <!-- Tree Generator -->
    <g transform="translate(15, 145)">
      <rect width="130" height="65" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="65" y="28" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Tree Builder</text>
      <text x="65" y="46" fill="#c084fc" font-size="9" text-anchor="middle">Hierarchical Index</text>
    </g>

    <!-- Commit Generator -->
    <g transform="translate(15, 230)">
      <rect width="130" height="85" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="65" y="26" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">Commit Builder</text>
      <text x="65" y="44" fill="#94a3b8" font-size="9" text-anchor="middle">Root Tree Pointer</text>
      <text x="65" y="58" fill="#94a3b8" font-size="9" text-anchor="middle">Parent DAG Links</text>
      <text x="65" y="72" fill="#94a3b8" font-size="9" text-anchor="middle">Author / PGP Sig</text>
    </g>
  </g>

  <!-- Tier 4: The Directed Acyclic Graph (DAG) -->
  <g transform="translate(720, 120)">
    <rect width="150" height="480" rx="10" fill="url(#objectGrad)" stroke="#9333ea" stroke-width="1.5"/>
    <text x="75" y="30" fill="#e9d5ff" font-size="12" font-weight="700" text-anchor="middle">OBJECT GRAPH (DAG)</text>

    <!-- Tree Node -->
    <g transform="translate(15, 60)">
      <rect width="120" height="55" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1.2"/>
      <text x="60" y="24" fill="#a78bfa" font-size="11" font-weight="700" text-anchor="middle">TREE (Root)</text>
      <text x="60" y="42" fill="#94a3b8" font-size="9" text-anchor="middle">SHA: 8fa3c9b...</text>
    </g>

    <!-- Blobs Nodes -->
    <g transform="translate(15, 130)">
      <rect width="120" height="70" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2"/>
      <text x="60" y="24" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">BLOBS</text>
      <text x="60" y="42" fill="#94a3b8" font-size="8" text-anchor="middle">README.md (d67046)</text>
      <text x="60" y="56" fill="#94a3b8" font-size="8" text-anchor="middle">app.py (f1e2d3)</text>
    </g>

    <!-- Commit Node C2 -->
    <g transform="translate(15, 220)">
      <rect width="120" height="65" rx="6" fill="#0f172a" stroke="#e879f9" stroke-width="1.2"/>
      <text x="60" y="24" fill="#f0abfc" font-size="11" font-weight="700" text-anchor="middle">COMMIT C2</text>
      <text x="60" y="40" fill="#94a3b8" font-size="8" text-anchor="middle">Tree: 8fa3c9b...</text>
      <text x="60" y="54" fill="#94a3b8" font-size="8" text-anchor="middle">Parent: C1 (a1b2c3)</text>
    </g>

    <!-- Commit Node C1 -->
    <g transform="translate(15, 305)">
      <rect width="120" height="55" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
      <text x="60" y="24" fill="#c084fc" font-size="11" font-weight="700" text-anchor="middle">COMMIT C1</text>
      <text x="60" y="42" fill="#94a3b8" font-size="8" text-anchor="middle">(Root Genesis)</text>
    </g>

    <!-- Refs Subsystem -->
    <g transform="translate(15, 385)">
      <rect width="120" height="75" rx="6" fill="url(#refGrad)" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="60" y="22" fill="#fda4af" font-size="10" font-weight="700" text-anchor="middle">MUTABLE REFS</text>
      <text x="60" y="40" fill="#f8fafc" font-size="9" text-anchor="middle">HEAD -&gt; main</text>
      <text x="60" y="56" fill="#f8fafc" font-size="8" text-anchor="middle">main: SHA of C2</text>
      <text x="60" y="68" fill="#94a3b8" font-size="7" text-anchor="middle">41-byte text file</text>
    </g>
  </g>

  <!-- Tier 5: Persistence & Storage Engine -->
  <g transform="translate(930, 120)">
    <rect width="130" height="480" rx="10" fill="url(#diskGrad)" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="30" fill="#fcd34d" font-size="12" font-weight="700" text-anchor="middle">STORAGE LAYER</text>

    <!-- Loose Objects -->
    <g transform="translate(15, 60)">
      <rect width="100" height="90" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="50" y="26" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle">Loose Objects</text>
      <text x="50" y="44" fill="#94a3b8" font-size="8" text-anchor="middle">.git/objects/xx/</text>
      <text x="50" y="60" fill="#94a3b8" font-size="8" text-anchor="middle">zlib compressed</text>
      <text x="50" y="76" fill="#94a3b8" font-size="8" text-anchor="middle">2-char sharding</text>
    </g>

    <!-- Packfiles -->
    <g transform="translate(15, 175)">
      <rect width="100" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="50" y="24" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle">Packfiles</text>
      <text x="50" y="40" fill="#94a3b8" font-size="8" text-anchor="middle">.pack (Deltas)</text>
      <text x="50" y="56" fill="#94a3b8" font-size="8" text-anchor="middle">.idx (Offsets)</text>
      <text x="50" y="72" fill="#94a3b8" font-size="8" text-anchor="middle">.bitmap (Reach)</text>
      <text x="50" y="86" fill="#38bdf8" font-size="7" text-anchor="middle">git gc auto</text>
    </g>

    <!-- Reflog -->
    <g transform="translate(15, 295)">
      <rect width="100" height="70" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2"/>
      <text x="50" y="26" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle">Reflog</text>
      <text x="50" y="44" fill="#94a3b8" font-size="8" text-anchor="middle">.git/logs/</text>
      <text x="50" y="58" fill="#94a3b8" font-size="8" text-anchor="middle">HEAD history</text>
    </g>
  </g>

  <!-- Legend at Bottom -->
  <g transform="translate(60, 640)">
    <circle cx="0" cy="10" r="5" fill="#38bdf8"/>
    <text x="12" y="14" fill="#94a3b8" font-size="10">Client / Working Tree</text>

    <circle cx="160" cy="10" r="5" fill="#2dd4bf"/>
    <text x="172" y="14" fill="#94a3b8" font-size="10">Staging Pipeline</text>

    <circle cx="300" cy="10" r="5" fill="#a855f7"/>
    <text x="312" y="14" fill="#94a3b8" font-size="10">Object Synthesis</text>

    <circle cx="440" cy="10" r="5" fill="#e879f9"/>
    <text x="452" y="14" fill="#94a3b8" font-size="10">Immutable DAG</text>

    <circle cx="560" cy="10" r="5" fill="#f43f5e"/>
    <text x="572" y="14" fill="#94a3b8" font-size="10">Mutable References</text>

    <circle cx="700" cy="10" r="5" fill="#f59e0b"/>
    <text x="712" y="14" fill="#94a3b8" font-size="10">Disk Pack &amp; Storage</text>
  </g>
</svg>
