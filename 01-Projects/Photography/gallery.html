<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography Gallery</title>
<style>
:root{
  --bg:#0e0f13;--card:#181a20;--line:#262932;--txt:#e8e9ee;--dim:#9aa0ad;--acc:#7ab8ff;
  --ok:#7dd3a0;--warn:#ffd479;--panel:#101218;
}
body.light{
  --bg:#f5f6f9;--card:#ffffff;--line:#d7dae2;--txt:#1a1b20;--dim:#6b6f7a;--acc:#2f6fd6;
  --ok:#2e8540;--warn:#c8861c;--panel:#eef0f5;
}
* {box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.5 'Segoe UI',system-ui,sans-serif;transition:background .2s,color .2s}
header{padding:16px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5;display:flex;flex-direction:column;gap:10px}
header h1{font-size:19px;font-weight:600;display:flex;gap:10px;align-items:center}
header .sub{color:var(--dim);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 14px;font-size:14px;outline:none}
#q:focus{border-color:var(--acc)}
#q::placeholder{color:var(--dim)}
#sort{background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:9px 10px;font-size:13px;outline:none;cursor:pointer}
.chips{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap}
.chip.on{color:var(--txt);border-color:var(--acc)}
.chip.warn{color:var(--warn);border-color:var(--warn)}
.chip.warn.on{color:#fff;background:var(--warn);color:#1a1b20}
.strip{display:flex;gap:10px;overflow-x:auto;padding:14px 24px 8px;scroll-behavior:smooth}
.strip::-webkit-scrollbar{height:8px}
.strip::-webkit-scrollbar-thumb{background:#333745;border-radius:4px}
body.light .strip::-webkit-scrollbar-thumb{background:#bbc0cc}
.strip .rv{height:78px;width:110px;border-radius:8px;cursor:pointer;flex:0 0 auto;border:2px solid transparent;object-fit:cover;position:relative;overflow:hidden}
.strip .rv.on{border-color:var(--acc)}
.strip .rv.empty{background:var(--card);border:1px dashed var(--line);color:var(--dim);font-size:11px;display:flex;align-items:center;justify-content:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:8px 24px 60px}
.content-vis{cache-visibility:auto;content-visibility:auto;contain-intrinsic-size:170px 220px}
.mhead{grid-column:1/-1;padding:14px 0 2px;font-size:14px;color:var(--acc);border-top:1px solid var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column}
.card img{width:100%;height:150px;object-fit:cover;display:block}
.card .vidtile{width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#000;color:var(--dim);font-size:34px}
.card .cap{padding:7px 10px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badge{position:absolute;top:6px;left:6px;background:rgba(0,0,0,.65);border-radius:4px;font-size:10px;padding:2px 6px;color:#ffd479}
.card .badge.sim{color:#7dd3a0}
.card .badge.favb{left:auto;right:6px;color:#ffd479;font-size:12px}
.card .badge.rating{left:auto;right:6px;top:26px;background:rgba(255,255,255,.15);color:#fff}
.card .play{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);border-radius:4px;font-size:11px;padding:2px 7px;color:#7ab8ff}
.card .dur{position:absolute;top:126px;right:6px;background:rgba(0,0,0,.7);border-radius:4px;font-size:10px;padding:1px 5px;color:#fff}
.card .dec{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.65);border-radius:4px;font-size:10px;padding:2px 6px}
.card .dec.keep{color:#7dd3a0}
.card .dec.dup{color:#ff7b7b}
.lb{position:fixed;inset:0;background:rgba(5,6,9,.96);display:none;z-index:20;flex-direction:column}
body.light .lb{background:rgba(245,246,249,.96)}
.lb.open{display:flex}
.lb.info-collapsed{background:#000}
body.light .lb.info-collapsed{background:#fff}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.lb .top .name{font-size:14px;color:var(--txt)}
.lb .top .x{cursor:pointer;font-size:22px;color:var(--dim);padding:0 8px}
.lb .mid{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.lb .mid img,.lb .mid video{max-width:100%;max-height:90vh;border-radius:6px;background:#000;display:block;margin:auto}
#lbimg{cursor:crosshair;transition:transform .15s,filter .15s}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:40px;color:var(--dim);cursor:pointer;padding:24px;user-select:none;z-index:2;opacity:.6}
.lb .nav:hover{opacity:1;color:#fff}
.lb .nav.prev{left:6px}.lb .nav.next{right:6px}
.lb .fb{display:none;color:var(--dim);font-size:14px;text-align:center;line-height:2;padding:40px}
.lb .fb a{color:var(--acc)}
#cmp{display:none;position:relative;width:min(92vw,1100px);height:74vh;background:#000;border-radius:6px;touch-action:none;cursor:ew-resize;overflow:hidden;margin:auto}
#cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
#cmpB{clip-path:inset(0 0 0 var(--x,50%))}
#cmpBar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#7ab8ff;pointer-events:none}
#cmpBar::after{content:'\21C4';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#7ab8ff;color:#0e0f13;border-radius:50%;width:32px;height:32px;line-height:32px;text-align:center;font-size:14px}
.clab{position:absolute;bottom:10px;background:rgba(0,0,0,.7);padding:2px 10px;border-radius:10px;font-size:12px;color:var(--txt);pointer-events:none}
#clabA{left:10px}#clabB{right:10px}
.lb .info{padding:12px 22px;border-top:1px solid var(--line);background:var(--panel);max-height:38vh;overflow:auto;flex-shrink:0;transition:width .25s,opacity .2s}
.lb.info-collapsed .info{width:0;opacity:0;padding:0;border:none;overflow:hidden}
.lb.info-collapsed .mid{height:100%}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.acts button,.acts select{background:#232733;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:12.5px}
body.light .acts button,body.light .acts select{background:#eef0f5;color:#1a1b20;border-color:#c4c7d0}
.acts button:hover{border-color:var(--acc)}
.acts .togg{font-size:12px}
.acts .togg.on{color:var(--acc);font-weight:700}
.lb .info .desc{font-size:15px;margin-bottom:6px}
.lb .info .tags span{display:inline-block;background:#232733;border-radius:12px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0;color:var(--acc);cursor:pointer}
body.light .lb .info .tags span{background:#dfe3ea;color:#1f6fd2}
.lb .info .meta{color:var(--dim);font-size:12.5px;line-height:1.7}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#232733;border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:60}
#toast.show{opacity:1}
h2.sec{padding:16px 24px 4px;font-size:15px;color:var(--acc)}
.stars{display:flex;gap:6px;margin:4px 0}
.stars s{cursor:pointer;font-size:16px;color:var(--dim);user-select:none;transition:color .1s}
.stars s.on{color:#ffd479}
.stars s.hover{color:#ffd479}
.decrow{display:flex;gap:10px;margin-top:8px}
.decrow button{background:#232733;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.decrow button.keep{border-color:var(--ok);color:var(--ok)}
.decrow button.dup{border-color:#ff7b7b;color:#ff7b7b}
.decrow button.active{background:var(--acc);color:#fff;border-color:var(--acc)}
.syntax{color:var(--dim);font-size:12px;margin-top:4px;max-width:700px}
.syntax b{color:var(--acc)}
.import-export{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.import-export button{background:#232733;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:12px}
#fileInput{display:none}
</style></head><body>
<header>
  <h1>🖼 Photography Gallery <span id="themeBtn" title="Toggle light/dark theme" style="cursor:pointer">🌙</span></h1>
  <div class="sub"><span id="count"></span><span id="stats"></span></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder="Search filename, description, tags, date, camera...  Try: "2024 beach" -screenshot cam:NIKON has:ocr" autocomplete="off">
    <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">By name</option><option value="rating">Top rated</option></select>
  </div>
  <div class="chips" id="chips"></div>
  <div class="syntax" id="syntax"></div>
  <div class="chips" id="yrs"></div>
</header>
<div class="rvwrap" style="padding:8px 24px 6px"><div class="strip" id="recent"></div></div>
<h2 class="sec">Filmstrip</h2><div class="strip" id="strip"></div>
<h2 class="sec">All photos</h2><div class="grid content-vis" id="grid"></div>
<div class="lb" id="lb">
 <div class="top"><div class="name" id="lbname"></div><div id="infoToggle" title="Hide info panel (fullscreen image)" style="cursor:pointer">⊖ Info</div><div class="x" onclick="closeLb()">&times;</div></div>
 <div class="mid"><div class="nav prev" onclick="step(-1)">&#8249;</div><img id="lbimg" alt=""><video id="lbvid" controls></video>
  <div id="cmp"><img id="cmpA" alt=""><img id="cmpB" alt=""><div id="cmpBar"></div><div class="clab" id="clabA"></div><div class="clab" id="clabB"></div></div>
  <div class="fb" id="lbfb">Video preview not available.<br><a id="lblink" href="#">Open the original file</a></div>
  <div class="nav next" onclick="step(1)">&#8250;</div></div>
 <div class="info">
  <div class="acts">
   <button id="btnCmp" onclick="cycleCmp()" style="display:none">Compare</button>
   <button id="btnSwap" onclick="swapCmp()" style="display:none">Swap sides</button>
   <div class="stars" id="lbstars" style="display:none"></div>
   <div class="decrow" id="lbdec" style="display:none"></div>
   <button onclick="showInFolder()">Show in folder</button>
   <button onclick="copyPath()">Copy path</button>
   <button id="btnPh" onclick="openPhotos()">Open in Photos</button>
   <button id="btnFav" onclick="toggleFav()"></button>
   <button id="btnSlide" onclick="toggleSlide()">Slideshow</button>
   <select id="slideSec"><option value="3">3s</option><option value="5" selected>5s</option><option value="10">10s</option></select>
   <button onclick="goFs()">Fullscreen</button>
   <div class="import-export"><button onclick="exportDecisions()">Export choices</button><button onclick="importDecisions()">Import choices</button><input type="file" id="fileInput" accept=".json"></div>
  </div>
  <div class="desc" id="lbdesc"></div><div class="tags" id="lbtags"></div><div class="meta" id="lbmeta"></div>
 </div>
</div>
<div id="toast"></div>
<script>
const DATA = __DATA__;
const LIB  = 'photography-library/';  // media lives one level below this page
const ROOT = 'C:\\Users\\Kanchan Verma\\OneDrive\\Desktop\\Opencode\\01-Projects\\Photography\\photography-library\\';
const VEXT = ['.avi','.mp4','.mov','.mts'];
const MN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtKB = s => s>1048576 ? (s/1048576).toFixed(1)+' MB' : (s/1024).toFixed(0)+' KB';
const fmtDur = s => { if(s===null||s===undefined) return ''; const m=Math.floor(s/60), r=Math.floor(s%60); return m+':'+String(r).padStart(2,'0'); };
const isVid = x => VEXT.includes(x.e);
const isHeic = x => x.e==='.heic';
const disp  = x => LIB + (x.disp || x.f);
const playPath = x => x.e==='.mp4' ? LIB+x.f : (x.e==='.avi'||x.e==='.mov'||x.e==='.mts' ? LIB+'playback/'+x.f.replace(/\//g,'__')+'.mp4' : null);
DATA.forEach(x=>{ x._s = (x.f+' '+(x.desc||'')+' '+(x.d||'')+' '+(x.dt||'')+' '+(x.c||'')+' '+x.k+' '+(x.tags||[]).join(' ')+' '+(x.ocr||'')).toLowerCase(); });
const grpSize = {}; DATA.forEach(x=>{ if(x.grp) grpSize[x.grp]=(grpSize[x.grp]||0)+1; });

let favs = new Set(), ratings = {}, decisions = {}, recent = [];
try { favs = new Set(JSON.parse(localStorage.getItem('photog_favs')||'[]')); } catch(e){}
try { ratings = JSON.parse(localStorage.getItem('photog_ratings')||'{}'); } catch(e){}
try { decisions = JSON.parse(localStorage.getItem('photog_decisions')||'{}'); } catch(e){}
try { recent = JSON.parse(sessionStorage.getItem('photog_recent')||'[]'); } catch(e){}
let favsOnly=false, kind='all', year='all', q='', sort='new', simOnly=false, heicOnly=false, view=DATA.slice(), cur=0, curIt=null;
let partners=[], cmpIdx=0, cmpOpen=false, infoOpen=true;
let slideT=null, zoomed=1, panX=0, panY=0, imgDrag=null, imgMoved=false, zoomOrigin={x:0,y:0};

const countEl=document.getElementById('count');
(function(){ const tot=DATA.reduce((a,x)=>a+(x.s||0),0)/1048576;
  const ds=DATA.map(x=>x.d).filter(Boolean).sort();
  document.getElementById('stats').textContent = ' | '+(ds[0]||'')+' to '+(ds[ds.length-1]||'')+' | '+tot.toFixed(0)+' MB'; })();

// theme
const themeBtn=document.getElementById('themeBtn');
function applyTheme(){ document.body.classList.toggle('light', themeBtn.dataset.light==='1'); themeBtn.textContent = themeBtn.dataset.light==='1'?'☀️':'🌙'; }
try{ themeBtn.dataset.light = localStorage.getItem('photog_theme')||'0'; }catch(e){}
applyTheme();
themeBtn.onclick=()=>{ themeBtn.dataset.light = themeBtn.dataset.light==='1'?'0':'1'; try{localStorage.setItem('photog_theme',themeBtn.dataset.light);}catch(e){} applyTheme(); };

// restore last filter
try{
  const s=sessionStorage.getItem('photog_state');
  if(s){ const st=JSON.parse(s); if(st.sort)sort=st.sort; if(st.kind!==undefined)kind=st.kind; if(st.year!==undefined)year=st.year; }
}catch(e){}
function saveState(){ try{sessionStorage.setItem('photog_state',JSON.stringify({sort,kind,year}));}catch(e){} }

function persist(){ try{
  localStorage.setItem('photog_favs',JSON.stringify([...favs]));
  localStorage.setItem('photog_ratings',JSON.stringify(ratings));
  localStorage.setItem('photog_decisions',JSON.stringify(decisions));
  sessionStorage.setItem('photog_recent',JSON.stringify(recent.slice(-50)));
  saveState();
}catch(e){}}
function addRecent(it){
  recent=recent.filter(x=>x!==it.f);
  recent.unshift(it.f);
  persist();
  renderRecent();
}
function renderRecent(){
  const el=document.getElementById('recent'); el.innerHTML='';
  const show=recent.slice(0,6);
  if(show.length===0){ el.appendChild(Object.assign(document.createElement('div'),{className:'rv empty',textContent:'Recently viewed'})); return; }
  show.forEach(f=>{ const it=itemmap[f]; if(!it)return;
    const d=document.createElement('div'); d.className='rv'+(curIt&&curIt.f===f?' on':'');
    d.src=disp(it); d.alt=it.f; d.title=it.f; d.onclick=()=>{ const i=view.findIndex(x=>x.f===f); if(i>=0)openLb(i); };
    el.appendChild(d);
  });
}
const itemmap={}; DATA.forEach(x=>itemmap[x.f]=x);

function parseSearch(raw){
  let phrase=null, q2=raw;
  const pm=q2.match(/"([^"]+)"/); if(pm){ phrase=pm[1].toLowerCase(); q2=q2.replace(pm[0],' '); }
  const fields={};
  q2=q2.replace(/(\w+):(\S+)/g,(_,k,v)=>{ fields[k]=v.toLowerCase(); return ' '; });
  const neg=[]; q2=q2.replace(/-(\S+)/g,(_,w)=>{ neg.push(w.toLowerCase()); return ' '; });
  const words=q2.split(/\s+/).filter(Boolean).map(w=>w.toLowerCase());
  return {words,neg,fields,phrase};
}
function matches(it,pr){
  const s=it._s;
  if(pr.words.some(w=>!s.includes(w))) return false;
  if(pr.neg.some(w=>s.includes(w))) return false;
  if(pr.phrase && !s.includes(pr.phrase)) return false;
  const f=pr.fields;
  if(f.cam && !(it.c||'').toLowerCase().includes(f.cam)) return false;
  if(f.date && !(it.d||'').startsWith(f.date)) return false;
  if(f.in){
    const v=f.in.split('|');
    if(v.includes('heic') && !isHeic(it)) return false;
    if(v.includes('video') && !isVid(it)) return false;
    if(v.includes('screenshot') && !(it.k||'').toLowerCase().includes('screen')) return false;
  }
  if(f.has){
    const v=f.has.split('|');
    if(v.includes('ocr') && !(it.ocr||'').trim()) return false;
    if(v.includes('desc') && !(it.desc||'').trim()) return false;
    if(v.includes('tags') && !(it.tags||[]).length) return false;
  }
  return true;
}
function apply(){
  const pr=parseSearch(q);
  let list=DATA.filter(x=>
    (favsOnly ? favs.has(x.f) : true) &&
    (kind==='all' || (kind==='videos'?isVid(x):x.k===kind)) &&
    (heicOnly ? isHeic(x) : true) &&
    (simOnly ? (x.grp && grpSize[x.grp]>1) : true) &&
    (year==='all' || (x.d||'').slice(0,4)===year) &&
    matches(x,pr));
  if(sort==='new') list.sort((a,b)=>((b.dt||b.mt||'')>(a.dt||a.mt||'')?1:-1));
  else if(sort==='old') list.sort((a,b)=>((a.dt||a.mt||'')>(b.dt||b.mt||'')?1:-1));
  else if(sort==='rating') list.sort((a,b)=>(ratings[b.f]||0)-(ratings[a.f]||0) || ((b.dt||b.mt||'')>(a.dt||b.mt||'')?1:-1));
  else list.sort((a,b)=>a.f.localeCompare(b.f));
  view=list; saveState();
  countEl.textContent=view.length+' of '+DATA.length+' items';
  render();
}
function buildChips(){
  const el=document.getElementById('chips'); el.innerHTML='';
  const kinds={}; DATA.forEach(x=>{ kinds[x.k]=(kinds[x.k]||0)+1; });
  const heicN=DATA.filter(isHeic).length;
  const simN=DATA.filter(x=>x.grp && grpSize[x.grp]>1).length;
  const defs=[['all',DATA.length],['videos',DATA.filter(isVid).length],['favorites',favs.size]];
  if(heicN) defs.push(['heic',heicN]);
  if(simN) defs.push(['similar',simN]);
  Object.keys(kinds).sort().forEach(k=>defs.push([k,kinds[k]]));
  defs.push(['favsOnly',favs.size]);
  const activeMap={'all':kind==='all'&&!favsOnly&&!simOnly&&!heicOnly,'videos':kind==='videos','favorites':kind==='favorites','heic':heicOnly,'similar':simOnly,'favsOnly':favsOnly};
  defs.forEach(d=>{ const lab=d[0], n=d[1];
    const c=document.createElement('div'); c.className='chip'+(activeMap[lab]?' on':'')+(lab==='similar'?' warn':'')+(lab==='heic'?' warn':'');
    c.textContent=lab+(lab!=='all'&&lab!=='favsOnly'?' '+n:'');
    c.onclick=()=>{
      if(lab==='favorites'){ favsOnly=!favsOnly; kind='all'; simOnly=false; heicOnly=false; }
      else if(lab==='favsOnly'){ favsOnly=false; }
      else if(lab==='similar'){ simOnly=!simOnly; heicOnly=false; favsOnly=false; kind='all'; }
      else if(lab==='heic'){ heicOnly=!heicOnly; simOnly=false; favsOnly=false; kind='all'; }
      else { favsOnly=false; simOnly=false; heicOnly=false; kind=lab; }
      buildChips(); apply();
    };
    el.appendChild(c);
  });
  // syntax hint
  const syn=document.getElementById('syntax');
  syn.innerHTML='<b>Search:</b> "quoted phrase"  -negation  cam:NIKON  date:2024-03  in:heic|video|screenshot  has:ocr|desc|tags';
}
function buildYears(){
  const yrs=[...new Set(DATA.map(x=>(x.d||'').slice(0,4)).filter(Boolean))].sort().reverse();
  const el=document.getElementById('yrs'); el.innerHTML='';
  ['all'].concat(yrs).forEach(y=>{ const c=document.createElement('div'); c.className='chip'+(y===year?' on':'');
    c.textContent=y; c.onclick=()=>{ year=y; buildYears(); apply(); }; el.appendChild(c); });
}
function ratingStars(f){
  const r=ratings[f]||0;
  let html='';
  for(let i=1;i<=5;i++) html+='<s'+(i<=r?' class="on"':'')+' title="Rate '+i+'" onclick="setRating('+i+')">★</s>';
  return html;
}
function setRating(r){
  if(!curIt)return;
  if(ratings[curIt.f]===r) delete ratings[curIt.f]; else ratings[curIt.f]=r;
  persist(); render(); show();
}
function toggleFav(){
  const f=view[cur].f;
  if(favs.has(f)){ favs.delete(f); flash('Removed from favorites'); }
  else { favs.add(f); flash('Added to favorites'); }
  persist(); render(); show();
}
function setDecision(f,dec){
  if(dec==='keep'){ decisions[f]='keep'; flash('Marked KEEP'); }
  else if(dec==='dup'){ decisions[f]='dup'; flash('Marked as duplicate'); }
  else { delete decisions[f]; flash('Decision cleared'); }
  persist(); render(); show();
}
function exportDecisions(){
  const blob=new Blob([JSON.stringify({favs:[...favs],ratings,decisions},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='photog-choices.json'; a.click(); URL.revokeObjectURL(url);
  flash('Choices exported');
}
function importDecisions(){
  document.getElementById('fileInput').onchange=e=>{
    const file=e.target.files[0]; if(!file)return;
    const fr=new FileReader(); fr.onload=ev=>{
      try{ const d=JSON.parse(ev.target.result);
        if(Array.isArray(d.favs)){ d.favs.forEach(f=>favs.add(f)); }
        if(d.ratings) ratings=Object.assign(ratings,d.ratings);
        if(d.decisions) decisions=Object.assign(decisions,d.decisions);
        persist(); render(); show(); flash('Choices imported');
      }catch(err){ flash('Import failed'); }
    }; fr.readAsText(file);
  }; document.getElementById('fileInput').click();
}
function tileEl(it, idx, small){
  const el=document.createElement('div'); el.className=small?'rv':'card'+(small?' content-vis':'');
  if(it.t){ const im=document.createElement('img'); im.src=LIB+it.t; im.loading='lazy'; im.decoding='async'; im.onclick=()=>openLb(idx); el.appendChild(im); }
  else { const v=document.createElement('div'); v.className='vidtile'; v.textContent='\25B6'; v.onclick=()=>openLb(idx); el.appendChild(v); }
  if(!small){
    const c=document.createElement('div'); c.className='cap'; c.textContent=(it.d||'')+' '+(it.desc||it.f.split('/').pop()); el.appendChild(c);
    if(it.dup){ const b=document.createElement('div'); b.className='badge'; b.textContent='dup'; el.appendChild(b); }
    else if(it.grp&&grpSize[it.grp]>1){ const b=document.createElement('div'); b.className='badge sim'; b.textContent='similar'; el.appendChild(b); }
    if(favs.has(it.f)){ const s=document.createElement('div'); s.className='badge favb'; s.textContent='\u2605'; el.appendChild(s); }
    const r=ratings[it.f]; if(r){ const s=document.createElement('div'); s.className='badge rating'; s.textContent='★'.repeat(r); el.appendChild(s); }
    const dec=decisions[it.f]; if(dec){ const b=document.createElement('div'); b.className='dec '+dec; b.textContent=dec==='keep'?'KEEP':'DUP'; el.appendChild(b); }
    if(isVid(it)){
      const p=document.createElement('div'); p.className='play'; p.textContent='\25B6'; el.appendChild(p);
      if(it.dur){ const d=document.createElement('div'); d.className='dur'; d.textContent=fmtDur(it.dur); el.appendChild(d); }
    }
  }
  return el;
}
function render(){
  const strip=document.getElementById('strip'); strip.innerHTML='';
  const grid=document.getElementById('grid'); grid.innerHTML='';
  let i=0, lastM=null;
  function chunk(){
    const end=Math.min(i+120, view.length);
    for(; i<end; i++){
      const it=view[i];
      if(sort!=='name'){
        const m=(it.d||'').slice(0,7);
        if(m && m!==lastM){ lastM=m;
          const h=document.createElement('div'); h.className='mhead';
          h.textContent=MN[parseInt(m.slice(5,7),10)-1]+' '+m.slice(0,4);
          grid.appendChild(h); }
      }
      strip.appendChild(tileEl(it,i,true));
      grid.appendChild(tileEl(it,i,false));
    }
    if(i<view.length) requestAnimationFrame(chunk);
  }
  chunk();
}
function openLb(i){ cur=i; show(); document.getElementById('lb').classList.add('open'); addRecent(view[cur]); }
function stopVid(){ const v=document.getElementById('lbvid'); try{v.pause();}catch(e){} v.removeAttribute('src'); v.load(); }
function closeCmp(quiet){
  const c=document.getElementById('cmp');
  if(c.style.display==='block'){ c.style.display='none'; cmpOpen=false; document.getElementById('btnSwap').style.display='none'; if(!quiet && curIt && !isVid(curIt)) document.getElementById('lbimg').style.display='block'; }
}
function closeLb(){
  if(slideT){ clearInterval(slideT); slideT=null; document.getElementById('btnSlide').textContent='Slideshow'; }
  stopVid(); closeCmp(true); document.getElementById('lb').classList.remove('open'); zoomed=1; panX=0; panY=0; updImg();
}
function step(n){ cur=(cur+n+view.length)%view.length; show(); addRecent(view[cur]); }
function show(){
  stopVid(); closeCmp(true);
  const it=view[cur]; curIt=it;
  const nm=document.getElementById('lbname'); nm.textContent=it.f.split('/').pop(); nm.title=it.f;
  const img=document.getElementById('lbimg'), vid=document.getElementById('lbvid'), fb=document.getElementById('lbfb');
  fb.style.display='none';
  zoomed=1; panX=0; panY=0; img.style.transform=''; img.style.filter=''; img.style.cursor='crosshair';
  if(isVid(it)){
    img.style.display='none';
    const p=playPath(it);
    if(p){ vid.style.display='block'; if(it.t) vid.poster=LIB+it.t; vid.src=p; vid.play().catch(()=>{}); }
    else { vid.style.display='none'; document.getElementById('lblink').href=LIB+it.f; fb.style.display='block'; }
  } else {
    vid.style.display='none';
    img.style.display='block'; img.src=disp(it);
  }
  document.getElementById('lbdesc').textContent=it.desc||'';
  document.getElementById('lbtags').innerHTML=(it.tags||[]).map(t=>'<span data-t="'+String(t).replace(/"/g,'')+'">'+t+'</span>').join('');
  let m=[];
  if(it.dt) m.push('Taken: '+it.dt);
  if(it.exif){ const e=it.exif, parts=[]; if(e.iso) parts.push('ISO '+e.iso); if(e.f) parts.push('f/'+e.f); if(e.sh) parts.push(e.sh); if(e.fl) parts.push(e.fl); if(parts.length) m.push('EXIF: '+parts.join(' | ')); }
  if(it.c) m.push('Camera: '+it.c);
  if(it.ocr) m.push('Text in image: '+it.ocr.replace(/\n/g,' | ').slice(0,140));
  if(it.w) m.push('Size: '+it.w+' x '+it.h);
  if(isVid(it)&&it.dur) m.push('Length: '+fmtDur(it.dur));
  m.push('File: '+fmtKB(it.s)); m.push('Type: '+it.k);
  if(isVid(it)) m.push('Playback: '+(playPath(it) ? (it.e==='.mp4'?'native':'optimized copy') : 'unavailable'));
  if(it.dup) m.push('Exact duplicate of: '+it.dup);
  if(it.near&&it.near.length) m.push('Similar to: '+it.near.join(', '));
  document.getElementById('lbmeta').innerHTML=m.map(x=>x+'<br>').join('');
  document.getElementById('btnCmp').style.display=(it.grp&&grpSize[it.grp]>1)?'':'none';
  document.getElementById('btnPh').style.display=isVid(it)?'none':'';
  document.getElementById('btnFav').textContent=favs.has(it.f)?'\u2605 Favorited':'\u2606 Favorite';
  document.getElementById('lbstars').innerHTML=ratingStars(it.f);
  document.getElementById('lbstars').style.display=isVid(it)?'none':'';
  const decrow=document.getElementById('lbdec');
  if(it.grp&&grpSize[it.grp]>1){
    decrow.style.display='';
    decrow.innerHTML='<button class="keep'+(decisions[it.f]==='keep'?' active':'')+'" onclick="setDecision(\''+it.f.replace(/'/g,"\\'")+'\',\'keep\')">Keep this</button><button class="dup'+(decisions[it.f]==='dup'?' active':'')+'" onclick="setDecision(\''+it.f.replace(/'/g,"\\'")+'\',\'dup\')">Mark duplicate</button><button onclick="setDecision(\''+it.f.replace(/'/g,"\\'")+'\',\'\')">Clear</button>';
  } else { decrow.style.display='none'; }
  partners = it.grp ? DATA.filter(x=>x.grp===it.grp && x.f!==it.f && !x.dup) : [];
  cmpIdx=0; preload();
}
function preload(){
  [1,-1].forEach(n=>{ const it=view[(cur+n+view.length)%view.length]; if(it && !isVid(it)){ const im=new Image(); im.src=disp(it); } });
}
function cycleCmp(){
  if(!partners.length) return;
  const a=view[cur], b=partners[cmpIdx % partners.length]; cmpIdx++;
  document.getElementById('cmpA').src=disp(a); document.getElementById('cmpB').src=disp(b);
  document.getElementById('clabA').textContent=a.role||a.f.split('/').pop();
  document.getElementById('clabB').textContent=b.role||b.f.split('/').pop();
  const c=document.getElementById('cmp'); c.style.setProperty('--x','50%'); c.style.display='block'; cmpOpen=true;
  document.getElementById('lbimg').style.display='none'; document.getElementById('lbvid').style.display='none'; document.getElementById('btnSwap').style.display='';
}
function swapCmp(){
  const iA=document.getElementById('cmpA'), iB=document.getElementById('cmpB'); const t=iA.src; iA.src=iB.src; iB.src=t;
  const lA=document.getElementById('clabA'), lB=document.getElementById('clabB'); const tl=lA.textContent; lA.textContent=lB.textContent; lB.textContent=tl;
}
const cmpEl=document.getElementById('cmp'); let cmpDrag=false;
function cmpSet(cx){ const r=cmpEl.getBoundingClientRect(); let p=(cx-r.left)/r.width*100; p=Math.max(0,Math.min(100,p)); cmpEl.style.setProperty('--x',p+'%'); }
cmpEl.addEventListener('pointerdown',e=>{ cmpDrag=true; cmpEl.setPointerCapture(e.pointerId); cmpSet(e.clientX); });
cmpEl.addEventListener('pointermove',e=>{ if(cmpDrag) cmpSet(e.clientX); });
cmpEl.addEventListener('pointerup',()=>{ cmpDrag=false; });
function nudgeCmp(d){ const r=cmpEl.getBoundingClientRect(); let curP=parseFloat(getComputedStyle(cmpEl).getPropertyValue('--x'))||50; cmpSet(r.left + r.width*(curP+d)/100); }
function showInFolder(){ location.href='photo-view:'+encodeURIComponent(ROOT?ROOT:LIB)+encodeURIComponent(view[cur].f); }
function openPhotos(){ location.href='ms-photos:viewer?filename='+encodeURIComponent(view[cur].f); }
let toastT=null;
function flash(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function fallbackCopy(p,done){ const ta=document.createElement('textarea'); ta.value=p; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ flash('Copy failed'); } ta.remove(); }
function copyPath(){
  const p=view[cur].f; const done=()=>flash('Path copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(p).then(done).catch(()=>fallbackCopy(p,done)); } else fallbackCopy(p,done);
}
function toggleSlide(){
  const b=document.getElementById('btnSlide');
  if(slideT){ clearInterval(slideT); slideT=null; b.textContent='Slideshow'; }
  else { const sec=parseInt(document.getElementById('slideSec').value,10)||5; slideT=setInterval(()=>step(1), sec*1000); b.textContent='Stop show'; }
}
function goFs(){ const lb=document.getElementById('lb');
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(lb.requestFullscreen){ lb.requestFullscreen().catch(()=>{}); } }
const lbimg=document.getElementById('lbimg');
function updImg(){
  const s='scale('+zoomed+') translate('+panX+'px,'+panY+'px)';
  lbimg.style.transform=s;
}
lbimg.addEventListener('click',e=>{
  if(imgMoved){ imgMoved=false; return; }
  // double-click zoom to point
  const r=lbimg.getBoundingClientRect();
  const nx=(e.clientX-r.left)/r.width, ny=(e.clientY-r.top)/r.height;
  const target=zoomed===1?2:(zoomed>=3?1:zoomed+1);
  const cx=r.width/2, cy=r.height/2;
  panX = -(nx*r.width*target - cx);
  panY = -(ny*r.height*target - cy);
  zoomed=target; updImg();
  lbimg.style.cursor=zoomed>1?'zoom-out':'crosshair';
});
lbimg.addEventListener('wheel',e=>{
  e.preventDefault();
  if(!curIt || isVid(curIt)) return;
  const r=lbimg.getBoundingClientRect();
  const nx=(e.clientX-r.left)/r.width, ny=(e.clientY-r.top)/r.height;
  const delta = e.deltaY>0 ? 0.9 : 1.1;
  const newZoomed=Math.min(3,Math.max(1, zoomed*delta));
  if(newZoomed===zoomed) return;
  const cx=r.width/2, cy=r.height/2;
  panX = -(nx*r.width*newZoomed - cx);
  panY = -(ny*r.height*newZoomed - cy);
  zoomed=newZoomed; updImg();
  lbimg.style.cursor=zoomed>1?'zoom-out':'crosshair';
}, {passive:false});
lbimg.addEventListener('pointerdown',e=>{
  if(zoomed>1){ imgDrag={x:e.clientX,y:e.clientY,px:panX,py:panY}; lbimg.setPointerCapture(e.pointerId); }
});
lbimg.addEventListener('pointermove',e=>{
  if(imgDrag){ const dx=e.clientX-imgDrag.x, dy=e.clientY-imgDrag.y; if(Math.abs(dx)>4||Math.abs(dy)>4) imgMoved=true; panX=imgDrag.px+dx; panY=imgDrag.py+dy; updImg(); }
});
lbimg.addEventListener('pointerup',()=>{ imgDrag=null; });
document.getElementById('infoToggle').onclick=()=>{
  infoOpen=!infoOpen;
  document.getElementById('lb').classList.toggle('info-collapsed',!infoOpen);
  document.getElementById('infoToggle').textContent = infoOpen?'⊖ Info':'⊕ Info';
  if(!infoOpen){ zoomed=1; panX=0; panY=0; updImg(); lbimg.style.cursor='crosshair'; }
};
const qEl=document.getElementById('q'); let qT=null;
qEl.addEventListener('input',()=>{ clearTimeout(qT); qT=setTimeout(()=>{ q=qEl.value; apply(); },120); });
document.getElementById('sort').onchange=function(){ sort=this.value; apply(); };
document.getElementById('lbtags').addEventListener('click',e=>{
  const t=e.target.getAttribute&&e.target.getAttribute('data-t');
  if(t){ q=t; qEl.value=t; closeLb(); apply(); }
});
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lb');
  if(!lb.classList.contains('open')) return;
  if(cmpOpen){
    if(e.key==='ArrowLeft'){ nudgeCmp(-3); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ nudgeCmp(3); e.preventDefault(); }
    else if(e.key==='Escape'||e.key==='c'||e.key==='C'){ closeCmp(); e.preventDefault(); }
    return;
  }
  if(e.key==='Escape') closeLb();
  else if(e.key==='ArrowRight'){ step(1); addRecent(view[cur]); }
  else if(e.key==='ArrowLeft'){ step(-1); addRecent(view[cur]); }
  else if(e.key===' '){ toggleSlide(); e.preventDefault(); }
  else if(e.key>='1'&&e.key<='5'){ setRating(parseInt(e.key)); e.preventDefault(); }
  else if(e.key==='i'||e.key==='I'){ document.getElementById('infoToggle').click(); e.preventDefault(); }
});
buildChips(); buildYears(); render(); renderRecent();
</script></body></html>
