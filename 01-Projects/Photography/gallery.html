<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography Gallery</title>
<style>
/* camlife-inspired tokens (oklch), plain CSS, no build step */
:root{
  --radius:0.625rem;
  --background:oklch(0.145 0 0);
  --foreground:oklch(0.985 0 0);
  --card:oklch(0.205 0 0);
  --card-foreground:oklch(0.985 0 0);
  --secondary:oklch(0.269 0 0);
  --secondary-foreground:oklch(0.985 0 0);
  --muted:oklch(0.269 0 0);
  --muted-foreground:oklch(0.708 0 0);
  --accent:oklch(0.488 0.243 264.376);
  --accent-foreground:oklch(0.985 0 0);
  --border:oklch(1 0 0 / 10%);
  --input:oklch(1 0 0 / 15%);
  --ok:oklch(0.696 0.17 162.48);
  --warn:oklch(0.769 0.188 70.08);
  /* aliases used by existing JS-generated markup */
  --bg:var(--background);--txt:var(--foreground);--dim:var(--muted-foreground);
  --line:var(--border);--acc:var(--accent);--panel:oklch(0.17 0 0);
}
body.light{
  --background:oklch(1 0 0);
  --foreground:oklch(0.145 0 0);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.145 0 0);
  --secondary:oklch(0.97 0 0);
  --secondary-foreground:oklch(0.205 0 0);
  --muted:oklch(0.97 0 0);
  --muted-foreground:oklch(0.556 0 0);
  --accent:oklch(0.488 0.243 264.376);
  --accent-foreground:oklch(0.985 0 0);
  --border:oklch(0.922 0 0);
  --input:oklch(0.922 0 0);
  --ok:oklch(0.6 0.118 184.704);
  --warn:oklch(0.828 0.189 84.429);
  --bg:var(--background);--txt:var(--foreground);--dim:var(--muted-foreground);
  --line:var(--border);--acc:var(--accent);--panel:oklch(0.985 0 0);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--background);color:var(--foreground);font:15px/1.5 'Segoe UI',system-ui,-apple-system,sans-serif;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased}

/* Header */
header{padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:color-mix(in oklch, var(--background) 92%, transparent);backdrop-filter:blur(10px);z-index:10;display:flex;flex-direction:column;gap:10px;padding-top:calc(14px + env(safe-area-inset-top, 0px))}
header h1{font-size:18px;font-weight:600;display:flex;gap:10px;align-items:center;letter-spacing:-0.01em}
header .sub{color:var(--muted-foreground);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#q{flex:1;min-width:0;height:38px;background:var(--input);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);color:var(--foreground);padding:0 14px;font-size:14px;line-height:1;outline:none;transition:border-color .15s,box-shadow .15s}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in oklch, var(--accent) 25%, transparent)}
#q::placeholder{color:var(--muted-foreground)}
#sort{height:38px;background:var(--input);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);color:var(--foreground);padding:0 10px;font-size:13px;line-height:1;outline:none;cursor:pointer;min-width:0}
.filter-btn{height:38px;background:var(--secondary);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);color:var(--foreground);padding:0 12px;font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.filter-btn:hover{border-color:color-mix(in oklch, var(--accent) 50%, var(--border))}
.filter-btn.has-active{border-color:var(--accent);background:color-mix(in oklch, var(--accent) 14%, var(--secondary))}
.filter-btn .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:none}
.filter-btn.has-active .dot{display:inline-block}
.filters-panel{display:flex;flex-direction:column;gap:8px;padding:10px 12px;background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius) - 2px);margin-top:2px}
.filters-panel[hidden]{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--secondary);border:1px solid var(--border);border-radius:999px;padding:5px 13px;cursor:pointer;font-size:13px;color:var(--muted-foreground);white-space:nowrap;transition:all .15s;user-select:none}
.chip:hover{border-color:color-mix(in oklch, var(--accent) 50%, var(--border));color:var(--foreground)}
.chip.on{color:var(--foreground);border-color:var(--accent);background:color-mix(in oklch, var(--accent) 18%, var(--secondary))}
.chip.warn{color:var(--warn);border-color:color-mix(in oklch, var(--warn) 50%, var(--border))}
.chip.warn.on{background:color-mix(in oklch, var(--warn) 22%, var(--secondary));color:var(--warn)}
.syntax{color:var(--muted-foreground);font-size:12px}
.syntax b{color:var(--accent);font-weight:600}

/* Filmstrip / recent */
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 20px 8px;scroll-behavior:smooth;scrollbar-width:thin}
.strip::-webkit-scrollbar{height:6px}
.strip::-webkit-scrollbar-thumb{background:var(--muted);border-radius:4px}
.strip .rv{height:72px;width:104px;min-width:104px;border-radius:calc(var(--radius) - 2px);cursor:pointer;border:2px solid transparent;object-fit:cover;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.strip .rv:hover{transform:scale(1.03)}
.strip .rv.on{border-color:var(--accent)}
.strip .rv.empty{background:var(--card);border:1px dashed var(--border);color:var(--muted-foreground);font-size:11px;display:flex;align-items:center;justify-content:center;width:auto;min-width:140px;padding:0 12px}
.rvwrap{padding:4px 0 2px}
h2.sec{padding:14px 20px 4px;font-size:13px;font-weight:600;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:0.04em}

/* Responsive grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:8px 20px 60px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:1280px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media(min-width:1536px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
.content-vis{content-visibility:auto;contain-intrinsic-size:180px 220px}
.mhead{grid-column:1/-1;padding:14px 0 4px;font-size:13px;font-weight:600;color:var(--accent);border-top:1px solid var(--border);margin-top:4px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;position:relative;display:flex;flex-direction:column;transition:transform .18s ease,box-shadow .18s ease,border-color .18s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px oklch(0 0 0 / 22%);border-color:color-mix(in oklch, var(--accent) 35%, var(--border))}
.card img{width:100%;height:160px;object-fit:cover;display:block;background:var(--muted)}
@media(min-width:1024px){.card img{height:175px}}
.card .vidtile{width:100%;height:160px;display:flex;align-items:center;justify-content:center;background:oklch(0.1 0 0);color:var(--muted-foreground);font-size:32px}
.card .cap{padding:7px 10px;font-size:12px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .badge{position:absolute;top:6px;left:6px;background:oklch(0 0 0 / 55%);backdrop-filter:blur(4px);border-radius:999px;font-size:10px;padding:2px 8px;color:var(--warn);border:1px solid oklch(1 0 0 / 10%)}
.card .badge.sim{color:var(--ok)}
.card .badge.favb{left:auto;right:6px;color:var(--warn);font-size:12px;padding:2px 6px}
.card .badge.rating{left:auto;right:6px;top:28px;background:oklch(0 0 0 / 55%);color:#fff;font-size:10px}
.card .play{position:absolute;top:6px;right:6px;background:oklch(0 0 0 / 55%);backdrop-filter:blur(4px);border-radius:999px;font-size:11px;padding:2px 8px;color:#fff;border:1px solid oklch(1 0 0 / 10%)}
.card .dur{position:absolute;bottom:36px;right:6px;background:oklch(0 0 0 / 65%);border-radius:4px;font-size:10px;padding:1px 5px;color:#fff}
.card .dec{position:absolute;bottom:6px;left:6px;background:oklch(0 0 0 / 60%);border-radius:999px;font-size:10px;padding:2px 8px;border:1px solid oklch(1 0 0 / 10%)}
.card .dec.keep{color:var(--ok)}
.card .dec.dup{color:oklch(0.704 0.191 22.216)}

/* Lightbox: full-screen, object-fit contain, bottom info sheet */
.lb{position:fixed;inset:0;background:oklch(0.08 0 0 / 98%);display:none;z-index:50;flex-direction:column}
body.light .lb{background:oklch(0.96 0 0 / 98%)}
.lb.open{display:flex}
.lb .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;flex-shrink:0;gap:10px}
.lb .top .name{font-size:13px;color:var(--foreground);opacity:.9;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.lb .top .x,#infoToggle{cursor:pointer;color:var(--foreground);background:oklch(1 0 0 / 8%);border:1px solid var(--border);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;line-height:1;padding:0;backdrop-filter:blur(6px);transition:background .15s,transform .15s;flex-shrink:0;vertical-align:middle}
#infoToggle{width:auto;height:34px;padding:0 12px;font-size:12px;font-weight:500;line-height:1}
.lb .top .x:hover,#infoToggle:hover{background:oklch(1 0 0 / 14%);transform:scale(1.04)}
.lb .mid{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:8px 56px;touch-action:pan-y}
/* object-fit contain prevents cropping; max-height 100% of mid keeps video controls visible */
.lb .mid img,.lb .mid video{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;border-radius:calc(var(--radius) - 2px);background:transparent;display:block;margin:auto}
#lbimg{cursor:zoom-in;transition:transform .15s ease-out;touch-action:none}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);margin:0;color:var(--foreground);cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;user-select:none;z-index:3;background:oklch(1 0 0 / 10%);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(6px);transition:background .15s,transform .15s;padding:0;line-height:0}
.lb .nav svg{display:block;flex-shrink:0}
.lb .nav:hover{background:oklch(1 0 0 / 18%);transform:translateY(-50%) scale(1.05)}
.lb .nav.prev{left:12px}.lb .nav.next{right:12px}
.lb .fb{display:none;color:var(--muted-foreground);font-size:14px;text-align:center;line-height:2;padding:40px}
.lb .fb a{color:var(--accent)}
#cmp{display:none;position:relative;width:min(92vw,1100px);height:100%;max-height:100%;background:oklch(0 0 0 / 40%);border-radius:calc(var(--radius) - 2px);touch-action:none;cursor:ew-resize;overflow:hidden;margin:auto}
#cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;user-select:none}
#cmpB{clip-path:inset(0 0 0 var(--x,50%))}
#cmpBar{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:var(--accent);pointer-events:none}
#cmpBar::after{content:'\21C4';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:#fff;border-radius:50%;width:32px;height:32px;line-height:32px;text-align:center;font-size:14px;box-shadow:0 2px 8px oklch(0 0 0 / 35%)}
.clab{position:absolute;bottom:10px;background:oklch(0 0 0 / 65%);backdrop-filter:blur(4px);padding:3px 10px;border-radius:999px;font-size:12px;color:#fff;pointer-events:none;border:1px solid oklch(1 0 0 / 10%)}
#clabA{left:10px}#clabB{right:10px}
/* Bottom info panel (slide sheet) - collapses so image goes fullscreen */
.lb .info{flex:0 0 auto;max-height:38vh;overflow:auto;padding:12px 18px 14px;border-top:1px solid var(--border);background:color-mix(in oklch, var(--background) 88%, transparent);backdrop-filter:blur(12px);transition:max-height .22s ease,padding .22s ease,opacity .18s ease,border-color .22s}
.lb.info-collapsed .info{max-height:0;padding-top:0;padding-bottom:0;opacity:0;border-top-color:transparent;overflow:hidden;pointer-events:none}
.lb.info-collapsed .mid{padding-bottom:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.acts button,.acts select{background:var(--secondary);border:1px solid var(--border);color:var(--foreground);border-radius:999px;padding:0 12px;min-height:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:12.5px;line-height:1;transition:background .15s,border-color .15s,transform .12s;vertical-align:middle}
.acts select{padding-right:10px}
.acts button:hover{border-color:color-mix(in oklch, var(--accent) 55%, var(--border));background:color-mix(in oklch, var(--accent) 12%, var(--secondary))}
.acts button:focus-visible,.acts select:focus-visible,#q:focus-visible,#sort:focus-visible{outline:2px solid color-mix(in oklch, var(--accent) 45%, transparent);outline-offset:1px}
.acts .togg{font-size:12px}.acts .togg.on{color:var(--accent);font-weight:700}
.lb .info .desc{font-size:14px;margin-bottom:6px;line-height:1.5}
.lb .info .tags span{display:inline-block;background:color-mix(in oklch, var(--accent) 14%, var(--secondary));border:1px solid color-mix(in oklch, var(--accent) 30%, var(--border));border-radius:999px;padding:2px 10px;font-size:12px;margin:0 6px 6px 0;color:var(--accent);cursor:pointer}
.lb .info .meta{color:var(--muted-foreground);font-size:12.5px;line-height:1.7}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%) translateY(8px);background:var(--card);color:var(--foreground);border:1px solid var(--border);border-radius:999px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:60;box-shadow:0 8px 24px oklch(0 0 0 / 25%);backdrop-filter:blur(8px);max-width:calc(100vw - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.stars{display:flex;gap:4px;margin:2px 0}
.stars s{cursor:pointer;font-size:16px;color:var(--muted-foreground);user-select:none;transition:color .1s,transform .1s;text-decoration:none}
.stars s:hover{transform:scale(1.1)}.stars s.on,.stars s.hover{color:var(--warn)}
.decrow{display:flex;gap:8px;flex-wrap:wrap}
.decrow button{background:var(--secondary);border:1px solid var(--border);color:var(--foreground);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12px}
.decrow button.keep{border-color:color-mix(in oklch, var(--ok) 55%, var(--border));color:var(--ok)}
.decrow button.dup{border-color:color-mix(in oklch, oklch(0.704 0.191 22.216) 55%, var(--border));color:oklch(0.704 0.191 22.216)}
.decrow button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.import-export{display:flex;gap:6px;flex-wrap:wrap}
#fileInput{display:none}

/* Mobile / phone optimizations */
@media (max-width: 640px){
  header{padding:10px 12px;gap:8px;padding-top:calc(10px + env(safe-area-inset-top, 0px))}
  header h1{font-size:16px}
  header .sub{font-size:12px}
  .toolbar{gap:6px}
  #q{width:100%;min-width:0;height:40px;font-size:16px} /* 16px avoids iOS zoom-on-focus */
  #sort{height:40px}
  .chips{gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:6px 12px;font-size:12.5px}
  .syntax{display:none}
  .filters-panel .syntax{display:block;font-size:11.5px;line-height:1.45}
  .filter-btn{height:40px}
  .filters-panel{padding:10px;max-height:min(46vh, 300px);overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .filters-panel .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .strip{padding:8px 12px;gap:8px}
  .rvwrap{padding:2px 0}
  h2.sec{padding:10px 12px 2px;font-size:12px}
  .grid{gap:8px;padding:6px 10px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom, 0px))}
  .card .cap{font-size:11px;padding:6px 8px}
  /* Lightbox mobile: tighter chrome, easier touch targets */
  .lb .top{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top, 0px))}
  .lb .top .name{font-size:12px}
  .lb .mid{padding:4px 8px}
  .lb .nav{width:40px;height:40px;background:oklch(0 0 0 / 28%);border-color:oklch(1 0 0 / 12%)}
  body.light .lb .nav{background:oklch(1 1 1 / 55%);color:oklch(0.2 0 0)}
  .lb .nav.prev{left:6px}.lb .nav.next{right:6px}
  .lb .nav svg{width:20px;height:20px}
  .lb .info{max-height:42vh;padding:10px 12px calc(12px + env(safe-area-inset-bottom, 0px));-webkit-overflow-scrolling:touch}
  .acts{gap:6px}
  .acts button,.acts select{min-height:36px;height:36px;font-size:12px;padding:0 11px}
  .lb .info .desc{font-size:13px}
  .lb .info .meta{font-size:12px}
  .stars s{font-size:18px;padding:2px} /* easier tap target */
  #cmp{width:100%;height:100%}
}
@media (max-width: 640px) and (orientation: landscape){
  .lb .info{max-height:34vh}
  .lb .top{padding-top:6px}
}
</style></head><body>
<header>
  <h1>Photography Gallery <span id="themeBtn" title="Toggle light/dark theme" style="cursor:pointer">🌙</span></h1>
  <div class="sub"><span id="count"></span><span id="stats"></span></div>
  <div class="toolbar">
    <input id="q" type="search" placeholder='Search: "phrase" -negation cam:NIKON date:2024 has:ocr|desc|tags' autocomplete="off">
    <select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="name">By name</option><option value="rating">Top rated</option></select>
    <button id="btnFilters" type="button" class="filter-btn" aria-expanded="false" aria-controls="filtersPanel">Filters</button>
  </div>
  <div id="filtersPanel" class="filters-panel" hidden>
    <div class="chips" id="chips"></div>
    <div class="syntax" id="syntax"></div>
    <div class="chips" id="yrs"></div>
  </div>
</header>
<div class="rvwrap"><div class="strip" id="recent"></div></div>
<h2 class="sec">Filmstrip</h2><div class="strip" id="strip"></div>
<h2 class="sec">All photos</h2><div class="grid content-vis" id="grid"></div>
<div class="lb" id="lb">
 <div class="top"><div class="name" id="lbname"></div><div id="infoToggle" title="Toggle info panel (i)">⊖ Info</div><div class="x" onclick="closeLb()">&times;</div></div>
 <div class="mid"><div class="nav prev" onclick="step(-1)" aria-label="Previous"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div><img id="lbimg" alt=""><video id="lbvid" controls></video>
  <div id="cmp"><img id="cmpA" alt=""><img id="cmpB" alt=""><div id="cmpBar"></div><div class="clab" id="clabA"></div><div class="clab" id="clabB"></div></div>
  <div class="fb" id="lbfb">Video preview not available.<br><a id="lblink" href="#">Open the original file</a></div>
  <div class="nav next" onclick="step(1)" aria-label="Next"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div>
 <div class="info">
  <div class="acts">
   <button id="btnCmp" onclick="cycleCmp()" style="display:none">Compare</button>
   <button id="btnSwap" onclick="swapCmp()" style="display:none">Swap sides</button>
   <div class="stars" id="lbstars" style="display:none"></div>
   <div class="decrow" id="lbdec" style="display:none"></div>
   <button onclick="showInFolder()">Show in folder</button>
   <button onclick="copyPath()">Copy path</button>
   <button onclick="downloadFile()">Download</button>
   <button id="btnPh" onclick="openPhotos()">Open in Photos</button>
   <button id="btnFav" onclick="toggleFav()"></button>
   <button id="btnSlide" onclick="toggleSlide()">Slideshow</button>
   <select id="slideSec"><option value="3">3s</option><option value="5" selected>5s</option><option value="10">10s</option></select>
   <button onclick="goFs()">Fullscreen</button>
   <div class="import-export"><button onclick="exportDecisions()">Export choices</button><button onclick="importDecisions()">Import choices</button><input type="file" id="fileInput" accept=".json"></div>
  </div>
  <div class="desc" id="lbdesc"></div><div class="tags" id="lbtags"></div><div class="meta" id="lbmeta"></div>
 </div>
</div>

function parseSearch(raw){
  let phrase=null, q2=raw;
  const pm=q2.match(/"([^"]+)"/); if(pm){ phrase=pm[1].toLowerCase(); q2=q2.replace(pm[0],' '); }
  const fields={};
  q2=q2.replace(/(\w+):(\S+)/g,(_,k,v)=>{ fields[k]=v.toLowerCase(); return ' '; });
  const neg=[]; q2=q2.replace(/-(\S+)/g,(_,w)=>{ neg.push(w.toLowerCase()); return ' '; });
  const words=q2.split(/\s+/).filter(Boolean).map(w=>w.toLowerCase());
  return {words,neg,fields,phrase};
}
function matches(it,pr){
  const s=it._s;
  if(pr.words.some(w=>!s.includes(w))) return false;
  if(pr.neg.some(w=>s.includes(w))) return false;
  if(pr.phrase && !s.includes(pr.phrase)) return false;
  const f=pr.fields;
  if(f.cam && !(it.c||'').toLowerCase().includes(f.cam)) return false;
  if(f.date && !(it.d||'').startsWith(f.date)) return false;
  if(f.in){
    const v=f.in.split('|');
    if(v.includes('heic') && !isHeic(it)) return false;
    if(v.includes('video') && !isVid(it)) return false;
    if(v.includes('screenshot') && !(it.k||'').toLowerCase().includes('screen')) return false;
  }
  if(f.has){
    const v=f.has.split('|');
    if(v.includes('ocr') && !(it.ocr||'').trim()) return false;
    if(v.includes('desc') && !(it.desc||'').trim()) return false;
    if(v.includes('tags') && !(it.tags||[]).length) return false;
  }
  return true;
}
function apply(){
  const pr=parseSearch(q);
  let list=DATA.filter(x=>
    (favsOnly ? favs.has(x.f) : true) &&
    (kind==='all' || (kind==='videos'?isVid(x):x.k===kind)) &&
    (heicOnly ? isHeic(x) : true) &&
    (simOnly ? (x.grp && grpSize[x.grp]>1) : true) &&
    (year==='all' || (x.d||'').slice(0,4)===year) &&
    matches(x,pr));
  if(sort==='new') list.sort((a,b)=>((b.dt||b.mt||'')>(a.dt||a.mt||'')?1:-1));
  else if(sort==='old') list.sort((a,b)=>((a.dt||a.mt||'')>(b.dt||b.mt||'')?1:-1));
  else if(sort==='rating') list.sort((a,b)=>(ratings[b.f]||0)-(ratings[a.f]||0) || ((b.dt||b.mt||'')>(a.dt||b.mt||'')?1:-1));
  else list.sort((a,b)=>a.f.localeCompare(b.f));
  view=list; saveState();
  countEl.textContent=view.length+' of '+DATA.length+' items';
  render();
}

  const el=document.getElementById('chips'); el.innerHTML='';

  const heicN=DATA.filter(isHeic).length;
  const simN=DATA.filter(x=>x.grp && grpSize[x.grp]>1).length;
  const defs=[['all',DATA.length],['videos',DATA.filter(isVid).length],['favorites',favs.size]];
  if(heicN) defs.push(['heic',heicN]);
  if(simN) defs.push(['similar',simN]);
  Object.keys(kinds).sort().forEach(k=>defs.push([k,kinds[k]]));
  defs.push(['favsOnly',favs.size]);
  const activeMap={'all':kind==='all'&&!favsOnly&&!simOnly&&!heicOnly,'videos':kind==='videos','favorites':kind==='favorites','heic':heicOnly,'similar':simOnly,'favsOnly':favsOnly};
  defs.forEach(d=>{ const lab=d[0], n=d[1];
    const c=document.createElement('div'); c.className='chip'+(activeMap[lab]?' on':'')+(lab==='similar'?' warn':'')+(lab==='heic'?' warn':'');
    c.textContent=lab+(lab!=='all'&&lab!=='favsOnly'?' '+n:'');

      if(lab==='favorites'){ favsOnly=!favsOnly; kind='all'; simOnly=false; heicOnly=false; }

      else if(lab==='similar'){ simOnly=!simOnly; heicOnly=false; favsOnly=false; kind='all'; }

      buildChips(); apply();
    };
    el.appendChild(c);
  });
  // syntax hint

    const file=e.target.files[0]; if(!file)return;

      try{ const d=JSON.parse(ev.target.result);
        if(Array.isArray(d.favs)){ d.favs.forEach(f=>favs.add(f)); }
        if(d.ratings) ratings=Object.assign(ratings,d.ratings);
        if(d.decisions) decisions=Object.assign(decisions,d.decisions);
        persist(); render(); show(); flash('Choices imported');
      }catch(err){ flash('Import failed'); }
    }; fr.readAsText(file);
  }; document.getElementById('fileInput').click();
}
function tileEl(it, idx, small){
  const el=document.createElement('div'); el.className=small?'rv':'card'+(small?' content-vis':'');
  if(it.t){ const im=document.createElement('img'); im.src=LIB+it.t; im.loading='lazy'; im.decoding='async'; im.onclick=()=>openLb(idx); el.appendChild(im); }
  else { const v=document.createElement('div'); v.className='vidtile'; v.textContent='\25B6'; v.onclick=()=>openLb(idx); el.appendChild(v); }
  if(!small){
    const c=document.createElement('div'); c.className='cap'; c.textContent=(it.d||'')+' '+(it.desc||it.f.split('/').pop()); el.appendChild(c);
    if(it.dup){ const b=document.createElement('div'); b.className='badge'; b.textContent='dup'; el.appendChild(b); }
    else if(it.grp&&grpSize[it.grp]>1){ const b=document.createElement('div'); b.className='badge sim'; b.textContent='similar'; el.appendChild(b); }
    if(favs.has(it.f)){ const s=document.createElement('div'); s.className='badge favb'; s.textContent='\u2605'; el.appendChild(s); }
    const r=ratings[it.f]; if(r){ const s=document.createElement('div'); s.className='badge rating'; s.textContent='★'.repeat(r); el.appendChild(s); }
    const dec=decisions[it.f]; if(dec){ const b=document.createElement('div'); b.className='dec '+dec; b.textContent=dec==='keep'?'KEEP':'DUP'; el.appendChild(b); }
    if(isVid(it)){
      const p=document.createElement('div'); p.className='play'; p.textContent='\25B6'; el.appendChild(p);
      if(it.dur){ const d=document.createElement('div'); d.className='dur'; d.textContent=fmtDur(it.dur); el.appendChild(d); }
    }
  }
  return el;
}
function render(){
  const strip=document.getElementById('strip'); strip.innerHTML='';
  const grid=document.getElementById('grid'); grid.innerHTML='';
  let i=0, lastM=null;
  function chunk(){
    const end=Math.min(i+120, view.length);
    for(; i<end; i++){
      const it=view[i];
      if(sort!=='name'){
        const m=(it.d||'').slice(0,7);
        if(m && m!==lastM){ lastM=m;
          const h=document.createElement('div'); h.className='mhead';
          h.textContent=MN[parseInt(m.slice(5,7),10)-1]+' '+m.slice(0,4);
          grid.appendChild(h); }
      }
      strip.appendChild(tileEl(it,i,true));
      grid.appendChild(tileEl(it,i,false));
    }
    if(i<view.length) requestAnimationFrame(chunk);
  }
  chunk();
}
function openLb(i){ cur=i; show(); document.getElementById('lb').classList.add('open'); addRecent(view[cur]); }
function stopVid(){ const v=document.getElementById('lbvid'); try{v.pause();}catch(e){} v.removeAttribute('src'); v.load(); }
function closeCmp(quiet){

}
function closeLb(){

  stopVid(); closeCmp(true); document.getElementById('lb').classList.remove('open'); zoomed=1; panX=0; panY=0; updImg();
}
function step(n){ cur=(cur+n+view.length)%view.length; show(); addRecent(view[cur]); }
function show(){
  stopVid(); closeCmp(true);
  const it=view[cur]; curIt=it;
  const nm=document.getElementById('lbname'); nm.textContent=it.f.split('/').pop(); nm.title=it.f;
  const img=document.getElementById('lbimg'), vid=document.getElementById('lbvid'), fb=document.getElementById('lbfb');
  fb.style.display='none';
  zoomed=1; panX=0; panY=0; img.style.transform=''; img.style.filter=''; img.style.transition=''; img.style.cursor=isVid(it)?'default':'zoom-in';
  if(isVid(it)){
    img.style.display='none';
    const p=playPath(it);
    if(p){ vid.style.display='block'; if(it.t) vid.poster=LIB+it.t; vid.src=p; vid.play().catch(()=>{}); }
    else { vid.style.display='none'; document.getElementById('lblink').href=LIB+it.f; fb.style.display='block'; }

    vid.style.display='none';

  document.getElementById('lbdesc').textContent=it.desc||'';
  document.getElementById('lbtags').innerHTML=(it.tags||[]).map(t=>'<span data-t="'+String(t).replace(/"/g,'')+'">'+t+'</span>').join('');
  let m=[];
  if(it.dt) m.push('Taken: '+it.dt);
  if(it.exif){ const e=it.exif, parts=[]; if(e.iso) parts.push('ISO '+e.iso); if(e.f) parts.push('f/'+e.f); if(e.sh) parts.push(e.sh); if(e.fl) parts.push(e.fl); if(parts.length) m.push('EXIF: '+parts.join(' | ')); }
  if(it.c) m.push('Camera: '+it.c);
  if(it.ocr) m.push('Text in image: '+it.ocr.replace(/\n/g,' | ').slice(0,140));
  if(it.w) m.push('Size: '+it.w+' x '+it.h);
  if(isVid(it)&&it.dur) m.push('Length: '+fmtDur(it.dur));
  m.push('File: '+fmtKB(it.s)); m.push('Type: '+it.k);
  if(isVid(it)) m.push('Playback: '+(playPath(it) ? (it.e==='.mp4'?'native':'optimized copy') : 'unavailable'));
  if(it.dup) m.push('Exact duplicate of: '+it.dup);
  if(it.near&&it.near.length) m.push('Similar to: '+it.near.join(', '));
  document.getElementById('lbmeta').innerHTML=m.map(x=>x+'<br>').join('');
  document.getElementById('btnCmp').style.display=(it.grp&&grpSize[it.grp]>1)?'':'none';
  document.getElementById('btnPh').style.display=isVid(it)?'none':'';
  document.getElementById('btnFav').textContent=favs.has(it.f)?'\u2605 Favorited':'\u2606 Favorite';
  document.getElementById('lbstars').innerHTML=ratingStars(it.f);
  document.getElementById('lbstars').style.display=isVid(it)?'none':'';
  const decrow=document.getElementById('lbdec');
  if(it.grp&&grpSize[it.grp]>1){
    decrow.style.display='';
    decrow.innerHTML='<button class="keep'+(decisions[it.f]==='keep'?' active':'')+'" onclick="setDecision(\''+it.f.replace(/'/g,"\\'")+'\',\'keep\')">Keep this</button><button class="dup'+(decisions[it.f]==='dup'?' active':'')+'" onclick="setDecision(\''+it.f.replace(/'/g,"\\'")+'\',\'dup\')">Mark duplicate</button><button onclick="setDecision(\''+it.f.replace(/'/g,"\\'")+'\',\'\')">Clear</button>';
  } else { decrow.style.display='none'; }
  partners = it.grp ? DATA.filter(x=>x.grp===it.grp && x.f!==it.f && !x.dup) : [];
  cmpIdx=0; preload();
}
function preload(){
  [1,-1].forEach(n=>{ const it=view[(cur+n+view.length)%view.length]; if(it && !isVid(it)){ const im=new Image(); im.src=disp(it); } });
}
function cycleCmp(){
  if(!partners.length) return;
  const a=view[cur], b=partners[cmpIdx % partners.length]; cmpIdx++;
  document.getElementById('cmpA').src=disp(a); document.getElementById('cmpB').src=disp(b);
  document.getElementById('clabA').textContent=a.role||a.f.split('/').pop();
  document.getElementById('clabB').textContent=b.role||b.f.split('/').pop();
  const c=document.getElementById('cmp'); c.style.setProperty('--x','50%'); c.style.display='block'; cmpOpen=true;
  document.getElementById('lbimg').style.display='none'; document.getElementById('lbvid').style.display='none'; document.getElementById('btnSwap').style.display='';
}
function swapCmp(){
  const iA=document.getElementById('cmpA'), iB=document.getElementById('cmpB'); const t=iA.src; iA.src=iB.src; iB.src=t;
  const lA=document.getElementById('clabA'), lB=document.getElementById('clabB'); const tl=lA.textContent; lA.textContent=lB.textContent; lB.textContent=tl;
}
const cmpEl=document.getElementById('cmp'); let cmpDrag=false;
function cmpSet(cx){ const r=cmpEl.getBoundingClientRect(); let p=(cx-r.left)/r.width*100; p=Math.max(0,Math.min(100,p)); cmpEl.style.setProperty('--x',p+'%'); }
cmpEl.addEventListener('pointerdown',e=>{ cmpDrag=true; cmpEl.setPointerCapture(e.pointerId); cmpSet(e.clientX); });
cmpEl.addEventListener('pointermove',e=>{ if(cmpDrag) cmpSet(e.clientX); });
cmpEl.addEventListener('pointerup',()=>{ cmpDrag=false; });
function nudgeCmp(d){ const r=cmpEl.getBoundingClientRect(); let curP=parseFloat(getComputedStyle(cmpEl).getPropertyValue('--x'))||50; cmpSet(r.left + r.width*(curP+d)/100); }
// Mobile swipe: left/right to navigate when not zoomed and not comparing
(function(){
  const mid=document.querySelector('.lb .mid');
  let s=null;
  mid.addEventListener('pointerdown',e=>{
    if(cmpOpen || imgDrag) return;
    if(!curIt) return;
    // Don't hijack when zoomed (image handles pan) or when interacting with controls
    if(zoomed > 1.01) return;
    if(e.target.closest('button,a,select,input,video,#cmp,.nav')) return;
    s={x:e.clientX,y:e.clientY,id:e.pointerId,t:Date.now()};
  }, {passive:true});
  mid.addEventListener('pointerup',e=>{
    if(!s || s.id!==e.pointerId) return;
    const dx=e.clientX-s.x, dy=e.clientY-s.y, dt=Date.now()-s.t;
    s=null;
    if(dt>700) return;
    if(Math.abs(dx)>55 && Math.abs(dx)>Math.abs(dy)*1.4){
      step(dx<0 ? 1 : -1);
    }
  }, {passive:true});
  mid.addEventListener('pointercancel',()=>{ s=null; }, {passive:true});
})();
function winPath(f){ return ROOT + f.split('/').join('\\'); }
function showInFolder(){
  // Use triple-slash + forward slashes for unambiguous parsing by the photo-view handler
  var p = winPath(view[cur].f).replace(/\\/g,'/');
  location.href = 'photo-view:///' + p.replace(/ /g,'%20');
}
function openPhotos(){

  location.href = 'ms-photos:viewer?fileName=' + p.replace(/ /g,'%20');

let toastT=null;
function flash(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function fallbackCopy(p,done){ const ta=document.createElement('textarea'); ta.value=p; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ flash('Copy failed'); } ta.remove(); }
function copyPath(){
  const p=view[cur].f; const done=()=>flash('Path copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(p).then(done).catch(()=>fallbackCopy(p,done)); } else fallbackCopy(p,done);
}
function downloadFile(){
  if(!view[cur]) return;
  const it=view[cur];
  // Prefer display/playable path when available; fall back to original
  let src = disp(it);
  if(isVid(it)){ const p = playPath(it); if(p) src = p; else src = LIB + it.f; }
  const name = (it.f.split('/').pop() || 'download');
  const a = document.createElement('a');
  a.href = src;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  flash('Download started');
}
function toggleSlide(){
  const b=document.getElementById('btnSlide');
  if(slideT){ clearInterval(slideT); slideT=null; b.textContent='Slideshow'; }
  else { const sec=parseInt(document.getElementById('slideSec').value,10)||5; slideT=setInterval(()=>step(1), sec*1000); b.textContent='Stop show'; }
}
function goFs(){ const lb=document.getElementById('lb');
  if(document.fullscreenElement){ document.exitFullscreen(); }
  else if(lb.requestFullscreen){ lb.requestFullscreen().catch(()=>{}); } }
const lbimg=document.getElementById('lbimg');
function clampPan(){
  // Keep image reasonably within view when zoomed
  if(zoomed<=1){ panX=0; panY=0; return; }
  const r=lbimg.getBoundingClientRect();
  // Approx limit based on scaled overflow (generous, works with object-fit)
  const maxX = (r.width * (zoomed-1)) / 2 + 80;
  const maxY = (r.height * (zoomed-1)) / 2 + 80;
  panX = Math.max(-maxX, Math.min(maxX, panX));
  panY = Math.max(-maxY, Math.min(maxY, panY));
}
function updImg(){
  // translate in screen pixels, then scale (transform-origin center)
  clampPan();
  lbimg.style.transformOrigin = 'center center';
  lbimg.style.transform = 'translate('+panX+'px,'+panY+'px) scale('+zoomed+')';
}
function zoomToPoint(clientX, clientY, targetZoom){
  const newZ = Math.min(4, Math.max(1, targetZoom));
  if(Math.abs(newZ - zoomed) < 0.001){
    if(newZ===1){ zoomed=1; panX=0; panY=0; }
    updImg(); return;
  }
  // Zoom toward cursor: adjust pan so the point under cursor stays put
  const r = lbimg.getBoundingClientRect();
  const cx = r.left + r.width/2;
  const cy = r.top + r.height/2;
  const dx = clientX - cx;
  const dy = clientY - cy;
  const ratio = newZ / zoomed;
  panX = dx - (dx - panX) * ratio;
  panY = dy - (dy - panY) * ratio;
  zoomed = newZ;
  if(zoomed <= 1.001){ zoomed=1; panX=0; panY=0; }
  updImg();
  lbimg.style.cursor = zoomed>1 ? 'grab' : 'zoom-in';
}
lbimg.addEventListener('click',e=>{
  if(imgMoved){ imgMoved=false; return; }
  if(!curIt || isVid(curIt)) return;
  // Single click toggles zoom in toward point / reset
  if(zoomed <= 1.01) zoomToPoint(e.clientX, e.clientY, 2.2);
  else if(zoomed < 3.5) zoomToPoint(e.clientX, e.clientY, zoomed * 1.5);
  else { zoomed=1; panX=0; panY=0; updImg(); lbimg.style.cursor='zoom-in'; }
});
lbimg.addEventListener('wheel',e=>{
  e.preventDefault();
  if(!curIt || isVid(curIt)) return;
  lbimg.style.transition = 'none';
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomToPoint(e.clientX, e.clientY, zoomed * factor);
  clearTimeout(lbimg._zt); lbimg._zt = setTimeout(()=>{ lbimg.style.transition=''; }, 120);
}, {passive:false});
lbimg.addEventListener('pointerdown',e=>{
  if(!curIt || isVid(curIt)) return;
  if(zoomed > 1.01){
    imgDrag={x:e.clientX,y:e.clientY,px:panX,py:panY};
    imgMoved=false;
    lbimg.setPointerCapture(e.pointerId);
    lbimg.style.cursor='grabbing';
    lbimg.style.transition='none';
  }
});
lbimg.addEventListener('pointermove',e=>{
  if(imgDrag){
    const dx=e.clientX-imgDrag.x, dy=e.clientY-imgDrag.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3) imgMoved=true;
    panX=imgDrag.px+dx; panY=imgDrag.py+dy; updImg();
  }
});
lbimg.addEventListener('pointerup',e=>{
  if(imgDrag){ imgDrag=null; lbimg.style.cursor = zoomed>1?'grab':'zoom-in'; lbimg.style.transition=''; }
});
lbimg.addEventListener('pointercancel',()=>{ imgDrag=null; lbimg.style.transition=''; });
document.getElementById('infoToggle').onclick=()=>{
  infoOpen=!infoOpen;
  document.getElementById('lb').classList.toggle('info-collapsed',!infoOpen);
  document.getElementById('infoToggle').textContent = infoOpen?'⊖ Info':'⊕ Info';
  if(!infoOpen){ zoomed=1; panX=0; panY=0; updImg(); const v=document.getElementById('lbvid'); v.style.transform=''; lbimg.style.cursor='zoom-in'; requestAnimationFrame(updImg); }
};
const qEl=document.getElementById('q'); let qT=null;
qEl.addEventListener('input',()=>{ clearTimeout(qT); qT=setTimeout(()=>{ q=qEl.value; apply(); },120); });
document.getElementById('sort').onchange=function(){ sort=this.value; apply(); };
document.getElementById('lbtags').addEventListener('click',e=>{
  const t=e.target.getAttribute&&e.target.getAttribute('data-t');
  if(t){ q=t; qEl.value=t; closeLb(); apply(); }
});
document.addEventListener('keydown',e=>{
  const lb=document.getElementById('lb');
  if(!lb.classList.contains('open')) return;
  if(cmpOpen){
    if(e.key==='ArrowLeft'){ nudgeCmp(-3); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ nudgeCmp(3); e.preventDefault(); }
    else if(e.key==='Escape'||e.key==='c'||e.key==='C'){ closeCmp(); e.preventDefault(); }
    return;
  }
  if(e.key==='Escape') closeLb();
  else if(e.key==='ArrowRight'){ step(1); addRecent(view[cur]); }
  else if(e.key==='ArrowLeft'){ step(-1); addRecent(view[cur]); }
  else if(e.key===' '){ toggleSlide(); e.preventDefault(); }
  else if(e.key>='1'&&e.key<='5'){ setRating(parseInt(e.key)); e.preventDefault(); }
  else if(e.key==='i'||e.key==='I'){ document.getElementById('infoToggle').click(); e.preventDefault(); }
});
buildChips(); buildYears(); render(); renderRecent();
